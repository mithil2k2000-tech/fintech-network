name: CI

# Phase 16. Everything in here has been run by hand at the end of every
# phase since Phase 1 — the point of this file is that it now runs
# whether anyone remembers to or not, on every push and every pull
# request.
#
# The jobs are split by what they need rather than by what they are:
# `checks` needs nothing but Node, `integration` and `e2e` need a real
# Postgres, and `migrations` needs an EMPTY one. Splitting them that way
# means a type error comes back in about a minute instead of waiting
# behind a browser suite.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first: the older answer
# is about code nobody has any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Test-only. A real secret never goes in a workflow file — see
  # docs/deployment/README.md for where deployment secrets live.
  JWT_SECRET: ci-only-secret-not-used-anywhere-else

jobs:
  checks:
    name: Types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # --frozen-lockfile: CI installs what the lockfile says and fails
      # if package.json and the lockfile disagree, rather than quietly
      # resolving something nobody has tested.
      - run: pnpm install --frozen-lockfile
      - name: Migrations are additive
        run: node scripts/check-migrations.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integration tests (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fintech
          POSTGRES_PASSWORD: fintech
          POSTGRES_DB: fintech_network
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fintech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://fintech:fintech@localhost:5432/fintech_network
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fintech-network/api migrate up
      - run: pnpm --filter @fintech-network/api test:integration

  e2e:
    name: End-to-end (all three apps)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fintech
          POSTGRES_PASSWORD: fintech
          POSTGRES_DB: fintech_network
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fintech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://fintech:fintech@localhost:5432/fintech_network
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fintech-network/api migrate up
      - name: Install the browser Playwright drives
        run: pnpm --filter web-consumer exec playwright install --with-deps chromium
      - run: pnpm e2e
      # Only on failure, and only for a week: a trace is a recording of
      # the app with test data in it, and it isn't something to keep
      # lying around.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web-consumer/test-results/
          retention-days: 7

  migrations:
    name: Migrations apply to an empty database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fintech
          POSTGRES_PASSWORD: fintech
          POSTGRES_DB: fintech_network_migrations
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U fintech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://fintech:fintech@localhost:5433/fintech_network_migrations
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The real check: a fresh database, every migration in order. A
      # migration that only works against a database that already has
      # last month's data in it passes every other job and fails on the
      # day someone sets up a new environment.
      - name: Apply every migration from empty
        run: pnpm --filter @fintech-network/api migrate up
      # And back down one step and up again, so a migration whose `down`
      # was never tried is caught here rather than during an incident,
      # when rolling back is the only thing anybody wants.
      - name: Roll the newest migration back and forward
        run: |
          pnpm --filter @fintech-network/api migrate down 1
          pnpm --filter @fintech-network/api migrate up

  image:
    name: Build the API image
    runs-on: ubuntu-latest
    needs: [checks]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Built, not pushed. There is no registry for a prototype that
      # moves no real money, and wiring one up before there is somewhere
      # to deploy to would be pipeline theatre. What this proves is that
      # the image still builds — which is the part that quietly rots.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: false
          tags: fintech-network-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
