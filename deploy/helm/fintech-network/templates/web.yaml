{{- $fullname := include "fn.fullname" . -}}
{{- range $i, $app := .Values.web.apps }}
{{- $sel := dict "root" $ "component" $app.name }}
{{- if $i }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-{{ $app.name }}
  labels:
    {{- include "fn.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $app.name }}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "fn.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fn.selectorLabels" $sel | nindent 8 }}
        fintech-network/tier: web
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "fn.podSecurityContext" $ | nindent 8 }}
      containers:
        # Static files behind nginx. The ingress sends /api straight to
        # the API, but nginx forwards it too, so the app also works
        # through a plain port-forward.
        - name: web
          image: {{ include "fn.image" (dict "root" $ "name" $app.name) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: API_UPSTREAM
              value: http://{{ $fullname }}-api:3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          resources:
            {{- toYaml $.Values.web.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-{{ $app.name }}
  labels:
    {{- include "fn.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $app.name }}
spec:
  selector:
    {{- include "fn.selectorLabels" $sel | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
