{{- if .Values.secrets.existingSecret }}
{{- if .Values.postgresql.enabled }}
{{- fail "secrets.existingSecret is for an external database: set postgresql.enabled=false" }}
{{- end }}
{{- else }}
{{- $jwt := required "secrets.jwtSecret is required (at least 32 characters)" .Values.secrets.jwtSecret }}
{{- if lt (len $jwt) 32 }}
{{- fail "secrets.jwtSecret must be at least 32 characters - the API refuses to start with less" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fn.secretName" . }}
  labels:
    {{- include "fn.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "fn.databaseUrl" . | quote }}
  JWT_SECRET: {{ $jwt | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | quote }}
  {{- end }}
{{- end }}
