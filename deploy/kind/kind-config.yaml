# A one-node local cluster. Ports 80 and 443 on your machine go to the
# ingress controller (Traefik), which listens on node ports 30080/30443.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fintech
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
