# kube-prometheus-stack, trimmed for a laptop: Prometheus, Grafana and
# the operator; no Alertmanager.
alertmanager:
  enabled: false
prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors and rules from every release, not only
    # this chart's own.
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 2d
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
grafana:
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
# kind's control-plane components aren't reachable for scraping; these
# would only produce permanently-down targets.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
